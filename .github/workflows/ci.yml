name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI may read the repository, but it cannot approve, merge, push, or modify PRs.
permissions:
  contents: read

env:
  # fzv is built with nightly: .cargo/config.toml passes a -Z flag.
  RUST_TOOLCHAIN: nightly

jobs:
  quality:
    name: Format, check, and test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run Clippy correctness checks
        run: cargo clippy --locked --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

  installer:
    name: Test the PowerShell installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Check that install.ps1 parses
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content install.ps1 -Raw)) | Out-Null

      # Packages the binary the way the release workflow does and installs from
      # the result: asset names, SHA256SUMS, the refusal of a tampered archive,
      # and a user PATH that keeps its registry value type.
      - name: Install from a packaged release
        shell: pwsh
        run: ./scripts/test-install.ps1 -Binary target/x86_64-pc-windows-msvc/release/fzv.exe
