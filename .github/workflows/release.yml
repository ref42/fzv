name: build-release

# Called by deploy.yml, which owns the tag trigger.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  # fzv is built with nightly: .cargo/config.toml passes a -Z flag.
  RUST_TOOLCHAIN: nightly

jobs:
  build:
    name: build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            arch: aarch64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "tag $env:RELEASE_TAG does not match Cargo.toml version $version (bump version and retag)"
          }

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fzv

      - name: Package
        shell: pwsh
        run: |
          # The packager names the assets, including the tagless
          # `fzv-windows-<arch>.zip` that install.ps1 downloads from
          # `releases/latest/download`.
          $names = ./scripts/package-windows.ps1 `
            -Tag $env:RELEASE_TAG `
            -Arch '${{ matrix.arch }}' `
            -Binary "target\${{ matrix.target }}\release\fzv.exe" `
            -OutputDir .

          "ASSETS<<EOF" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $names | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'EOF' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: fzv-${{ inputs.tag }}-${{ matrix.arch }}
          path: |
            ${{ env.ASSETS }}

  installer:
    name: publish the PowerShell installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check that install.ps1 parses
        shell: pwsh
        run: |
          [ScriptBlock]::Create((Get-Content install.ps1 -Raw)) | Out-Null

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: fzv-installer
          path: install.ps1

  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, installer]
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          sparse-checkout: .github/release_notes
          sparse-checkout-cone-mode: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksum the assets
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > ../SHA256SUMS

      - name: Use a placeholder when the tag has no release notes
        run: |
          set -euo pipefail
          notes=".github/release_notes/${{ inputs.tag }}.md"
          if [ ! -f "$notes" ]; then
            printf '# fzv %s\n\nSee the commit history for what changed.\n' "${{ inputs.tag }}" > "$notes"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release-assets/*
            SHA256SUMS
          body_path: .github/release_notes/${{ inputs.tag }}.md
