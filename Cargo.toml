[package]
name = "fzv"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt-multi-thread", "time"] }
winreg = "0.56.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

